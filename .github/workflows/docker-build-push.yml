name: build-and-push-images

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tencent Cloud TCR
  # Example: xxx.tencentcloudcr.com
  REGISTRY: ${{ secrets.TCR_REGISTRY }}
  # Namespace / project in TCR
  IMAGE_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ github.event.repository.name }}-${{ matrix.name }}
          tags: |
            type=sha,format=short,suffix=-commit
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build (and push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SILICONFLOW_API_KEY=${{ secrets.VITE_SILICONFLOW_API_KEY }}
            VITE_MOI_BASE_URL=${{ secrets.VITE_MOI_BASE_URL }}
            VITE_MOI_API_KEY=${{ secrets.VITE_MOI_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


